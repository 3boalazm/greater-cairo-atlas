name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript strict typecheck
        run: npm run typecheck

      - name: Run Vitest unit & route tests
        run: npm test

      - name: Verify SQL migrations offline
        run: npm run db:migrate:dry-run

      - name: Verify seed schema & data/seed files offline
        run: npm run seed:check

      - name: Build Next.js production bundle (no DB required)
        run: npm run build
