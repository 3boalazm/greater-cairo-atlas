name: Migrate Database

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-database-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply SQL Migrations to Neon (Manual Override)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify DATABASE_URL secret is configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          set +x
          if [ -z "${DATABASE_URL_UNPOOLED:-}" ] && [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Missing required GitHub Actions secret 'DATABASE_URL' (or 'DATABASE_URL_UNPOOLED'). Note: normal deployments run migrations automatically on Vercel via vercel-build."
            exit 1
          fi
          echo "Verified migration database secret is present (value hidden)."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply pending SQL migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          set +x
          npm run db:migrate
