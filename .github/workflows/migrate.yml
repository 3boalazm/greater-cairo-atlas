name: Migrate Database

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "db/migrations/**"

permissions:
  contents: read

concurrency:
  group: neon-database-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply SQL Migrations to Neon
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify DATABASE_URL secret is configured
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set +x
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Missing required GitHub Actions repository secret 'DATABASE_URL'. Configure it under Settings -> Secrets and variables -> Actions -> Repository secrets before running migrations."
            exit 1
          fi
          echo "Verified DATABASE_URL secret is present (value hidden)."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply pending SQL migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set +x
          npm run db:migrate
